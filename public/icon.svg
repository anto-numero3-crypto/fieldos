<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="currentColor">
  <!-- Monitor body -->
  <rect x="6" y="24" width="36" height="24" rx="2" fill="currentColor"/>
  <!-- Monitor stand -->
  <rect x="19" y="48" width="10" height="4" fill="currentColor"/>
  <rect x="15" y="52" width="18" height="3" rx="1" fill="currentColor"/>
  <!-- Screen shine line -->
  <rect x="10" y="28" width="14" height="2" rx="1" fill="white" opacity="0.3"/>
  <!-- Connection lines from monitor top -->
  <line x1="14" y1="24" x2="8" y2="12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="18" y2="8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="24" y2="6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="30" y2="8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="34" y1="24" x2="40" y2="12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Connection dots -->
  <circle cx="8" cy="10" r="4" fill="currentColor"/>
  <circle cx="18" cy="6" r="3.5" fill="currentColor"/>
  <circle cx="24" cy="4" r="3" fill="currentColor"/>
  <circle cx="30" cy="6" r="3.5" fill="currentColor"/>
  <circle cx="40" cy="10" r="4" fill="currentColor"/>
</svg>
