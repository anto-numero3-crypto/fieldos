<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="#333">
  <!-- Monitor screen -->
  <rect x="10" y="36" width="42" height="28" rx="3" />
  <!-- Monitor stand neck -->
  <rect x="26" y="64" width="10" height="4" />
  <!-- Monitor stand base -->
  <rect x="21" y="68" width="20" height="3" rx="1.5" />

  <!-- Connection structure above monitor - circuit/tree style with right-angle paths -->

  <!-- Far left branch: goes up from monitor, turns left, ends with node -->
  <path d="M18 36 L18 28 L10 28 L10 18" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="10" cy="15" r="3.5" />

  <!-- Left-center branch: goes up from monitor, slight left, node -->
  <path d="M24 36 L24 22 L18 22 L18 12" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="18" cy="9" r="3" />

  <!-- Center branch: straight up, node at top -->
  <path d="M31 36 L31 10" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="31" cy="7" r="3.5" />

  <!-- Right-center branch: goes up, turns right, node -->
  <path d="M38 36 L38 22 L44 22 L44 12" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="44" cy="9" r="3" />

  <!-- Far right branch: goes up from monitor, turns right, node -->
  <path d="M44 36 L44 28 L52 28 L52 18" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="52" cy="15" r="3.5" />

  <!-- Small horizontal connector bars on the circuit lines -->
  <rect x="13" y="27" width="8" height="2" rx="1" />
  <rect x="41" y="27" width="8" height="2" rx="1" />
</svg>
